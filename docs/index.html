<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인사조직관리 스터디</title>
  <meta name="description" content="MIT·Stanford·Wharton·Michigan·Harvard 공개 강의와 KOCW로 구성한 4학기 인사조직관리 자기주도 커리큘럼 학습 도우미">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EHR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // 테마를 첫 페인트 전에 적용 (깜빡임 방지)
    try { var t = JSON.parse(localStorage.getItem('hrcur:v1') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">HR</span>
      <span class="brand-text">인사조직관리 스터디</span>
    </a>
    <div class="topbar-progress" title="전체 진행률">
      <span data-meter-text="overall-stages">0 / 6</span>
      <div class="meter small" data-meter="overall"><span></span></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="테마 전환" title="테마: 시스템"></button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="사이트 내비게이션"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1">
      <noscript><p class="notice">이 사이트는 JavaScript가 필요합니다.</p></noscript>
    </main>
  </div>

  <script src="data/content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
